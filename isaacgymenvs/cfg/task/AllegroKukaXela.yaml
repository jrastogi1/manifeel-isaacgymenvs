defaults:
  - _self_
  - env: reorientation

name: AllegroKukaXela

physics_engine: ${..physics_engine}

env:
  subtask: "reorientation"

  # if given, will override the device setting in gym.
  numEnvs: ${resolve_default:8192,${...num_envs}}

  envSpacing: 1.2
  episodeLength: 600
  enableDebugVis: False
  evalStats: False  # extra evaluation-time statistics

  clampAbsObservations: 10.0

  stiffnessScale: 1.0
  forceLimitScale: 1.0
  useRelativeControl: False
  dofSpeedScale: 10.0
  actionsMovingAverage: 1.0
  controlFrequencyInv: 1 # 60 Hz

  resetPositionNoiseX: 0.1
  resetPositionNoiseY: 0.1
  resetPositionNoiseZ: 0.02
  resetRotationNoise: 1.0
  resetDofPosRandomIntervalFingers: 0.1
  resetDofPosRandomIntervalArm: 0.1
  resetDofVelRandomInterval: 0.5

  # Random forces applied to the object
  forceScale: 2.0
  forceProbRange: [0.001, 0.1]
  forceDecay: 0.99
  forceDecayInterval: 0.08

  liftingRewScale: 40.0
  liftingBonus: 300.0
  liftingBonusThreshold: 0.15  # when the object is lifted this distance (in meters) above the table, the agent gets the lifting bonus
  keypointRewScale: 200.0
  distanceDeltaRewScale: 50.0
  reachGoalBonus: 1000.0
  kukaActionsPenaltyScale: 0.003
  allegroActionsPenaltyScale: 0.0003
  fallDistance: 0.24
  fallPenalty: 0.0

  privilegedActions: False
  privilegedActionsTorque: 0.02

  # Physics v1, pretty much default settings we used from the start of the project
  dofFriction: -1.0  # negative values are ignored and the default friction from URDF file is used

  # gain of PD controller (?)
  allegroStiffness: 30.0
  kukaStiffness: 40.0

  allegroEffort: 0.35  # this is what was used in sim-to-real experiment. Motor torque in Newton*meters
  kukaEffort: [300, 300, 300, 300, 300, 300, 300]  # see Physics v2

  allegroDamping: 5.0
  kukaDamping: 5.0

  allegroArmature: 0
  kukaArmature: 0

  keypointScale: 1.5
  objectBaseSize: 0.05

  randomizeObjectDimensions: True
  withSmallCuboids: True
  withBigCuboids: True
  withSticks: True

  objectType: "block"
  observationType: "full_state"
  successTolerance: 0.075
  targetSuccessTolerance: 0.01
  toleranceCurriculumIncrement: 0.95  # multiplicative
  toleranceCurriculumInterval: 6000  # in env steps across all agents, with 8192 this is 3000 * 8192 = 24.6M env steps
  maxConsecutiveSuccesses: 50
  successSteps: 1  # how many steps we should be within the tolerance before we declare a success

  saveStates: False
  saveStatesFile: "rootTensorsDofStates.bin"

  loadInitialStates: False
  loadStatesFile: "rootTensorsDofStates.bin"

  # ---------------------------- XELA tactile ----------------------------
  # Gain applied to raw patch contact forces (Newtons) before squashing.
  # Contact forces on the patches are O(1-50 N); 0.02 maps ~25 N to tanh(0.5)
  # and ~100 N to near-saturation, giving a good dynamic range.
  taxelForceScale: 0.02
  # If true, taxel readings are passed through tanh for a bounded [-1, 1] range.
  taxelNormalize: True
  # Hard clip applied to each taxel axis after scaling/normalization.
  taxelClip: 10.0
  # Gaussian bandwidth (metres) used to spatially distribute each patch's force
  # across its taxels. ~ a couple of taxel spacings (taxels are ~4-6 mm apart).
  taxelSigma: 0.006
  # Patch net-force magnitude (N) below which the patch is treated as contact-free.
  taxelForceThreshold: 0.05

  asset:
    # 7-DOF KUKA iiwa7 arm + 16-DOF Allegro hand with 18 XELA uSkin patches
    # (368 taxels, 3-axis each). Generated by gen_xela_urdf.py.
    kukaAllegro: "urdf/kuka_allegro_description/kuka_allegro_xela.urdf"

    assetFileNameBlock: "urdf/objects/cube_multicolor.urdf"

task:
  randomize: False
  randomization_params:

sim:
  substeps: 2
  dt: 0.01667 # 1/60
  up_axis: "z"
  use_gpu_pipeline: ${eq:${...pipeline},"gpu"}
  num_client_threads: 8

  gravity: [0.0, 0.0, -9.81]
  physx:
    num_threads: 6
    solver_type: 1  # 0: pgs, 1: tgs
    num_position_iterations: 8
    num_velocity_iterations: 0

    max_gpu_contact_pairs: 8388608 # 8*1024*1024
    num_subscenes: ${....num_subscenes}
    contact_offset: 0.002
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 1000.0
    default_buffer_size_multiplier: 25.0
    # XELA: collect contacts on the last substep so the per-body net contact
    # force tensor is populated and can be read for the taxel observations.
    contact_collection: 1

